version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # vitest 4+/5+ dropped Node 18, which MCPVeil still supports (engines
      # >=18.17.0, CI matrix 18|20|22). Re-enable when Node 18 support ends.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/mocker"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
