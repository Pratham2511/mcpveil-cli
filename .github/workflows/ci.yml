name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - name: Save the CLI runtime under test
        id: runtime
        run: echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
      # Vitest 5 needs Node >=22.12. The built CLI and fixture servers still
      # run on the matrix version through MCPVEIL_TEST_NODE in the e2e harness.
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e   # the accuracy harness gate
        env:
          MCPVEIL_TEST_NODE: ${{ steps.runtime.outputs.node }}
      - run: npm run test:package
        env:
          MCPVEIL_TEST_NODE: ${{ steps.runtime.outputs.node }}
