name: Security (dogfood)
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly

jobs:
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # for SARIF upload
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build
      # dogfood: MCPVeil scanning its own hardened control server
      # (scan may exit 1 if findings are ever reported — we still want the SARIF)
      - name: MCPVeil self-scan (static+active)
        run: |
          node dist/cli.js scan \
            --stdio "node_modules/.bin/tsx test/safe-server/index.ts" \
            --format sarif -o mcpveil.sarif --yes || true
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: mcpveil.sarif
      # the accuracy gate itself lives in ci.yml — this workflow proves the
      # SARIF we ship is accepted by GitHub Code Scanning (dogfooding).
