name: Platform compatibility
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  compatible:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:package
