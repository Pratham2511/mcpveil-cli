<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1b26; display: flex; align-items: center; justify-content: center; }
  .term {
    width: 960px; height: 640px; background: #16161e;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  .bar {
    height: 34px; background: #1f2335; display: flex; align-items: center;
    padding: 0 14px; gap: 8px; flex: 0 0 auto;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .bar span { margin-left: 10px; color: #565f89; font-size: 12px; }
  .body {
    flex: 1; padding: 14px 20px; color: #a9b1d6; font-size: 13.5px;
    line-height: 1.5; white-space: pre-wrap;
  }
  .prompt { color: #9ece6a; font-weight: 700; }
  .cmd { color: #e0af68; }
  .flag { color: #bb9af7; }
  .dim { color: #565f89; }
  .crit { color: #f7768e; font-weight: 700; }
  .high { color: #ff9e64; font-weight: 700; }
  .med { color: #e0af68; font-weight: 700; }
  .tool { color: #7dcfff; }
  .score-f { color: #f7768e; font-weight: 800; }
  .score-badge { color: #16161e; background: #f7768e; padding: 1px 8px; border-radius: 4px; font-weight: 800; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: #a9b1d6; vertical-align: -2px; }
  .hr { color: #292e42; }
</style>
</head>
<body>
<div class="term">
  <div class="bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>mcpveil — zsh</span></div>
  <div class="body" id="out"></div>
</div>
<script>
const H = [];

H.push(`<span class="prompt">➜ </span><span class="dim">~/mcp-servers/registry-api</span> <span class="cmd">npx mcpveil</span> <span class="flag">scan</span> <span class="flag">--stdio</span> "node vulnerable-server.js" <span class="flag">--yes</span>`);
H.push(`<span class="dim">[mcpveil] connecting via stdio…</span>`);
H.push(`<span class="dim">[mcpveil] inventory: 8 tools · 1 resource · 0 prompts</span>`);
H.push(`<span class="dim">[mcpveil] running check: path-traversal</span>`);
H.push(`<span class="crit">  ✗ CRITICAL  command-injection  </span><span class="tool">run_command</span>      OS command injection confirmed (argument 'command')`);
H.push(`<span class="crit">  ✗ CRITICAL  sql-injection      </span><span class="tool">search_users</span>    tautology row-blast: 3 rows vs 0 benign`);
H.push(`<span class="crit">  ✗ CRITICAL  ssrf               </span><span class="tool">fetch_url</span>       loopback admin service reachable (127.0.0.1:8377)`);
H.push(`<span class="high">  ✗ HIGH      path-traversal     </span><span class="tool">read_file</span>       /etc/passwd readable — root:x:0:0:…`);
H.push(`<span class="high">  ✗ HIGH      path-traversal     </span><span class="tool">read_notes</span>      base-dir escape via '../canary.txt' (canary content)`);
H.push(`<span class="crit">  ✗ CRITICAL  credential-leak    </span><span class="tool">file:///.env</span>    AWS Secret Access Key → wJa****EXAMPLEKEY`);
H.push(`<span class="crit">  ✗ CRITICAL  credential-leak    </span><span class="tool">get_system_info</span> GitHub PAT → ghp_****Q7r8`);
H.push(`<span class="med">  ✗ MEDIUM    prompt-injection   </span><span class="tool">dictionary_lookup</span> invisible unicode U+200B/U+202E in description`);
H.push(`<span class="med">  ✗ MEDIUM    prompt-injection   </span><span class="tool">dictionary_lookup</span> override phrasing: "ignore previous instructions"`);
H.push(`<span class="dim">[mcpveil] 83 findings · 248 tool invocations · 10.3s</span>`);
H.push(`<span class="hr">──────────────────────────────────────────────────────────</span>`);
H.push(`<span class="dim"> Check              Invocations   Findings   Errors</span>`);
H.push(`<span class="dim"> path-traversal     96            13         0</span>`);
H.push(`<span class="dim"> command-injection  64            2          0</span>`);
H.push(`<span class="dim"> sql-injection      48            12         0</span>`);
H.push(`<span class="dim"> ssrf               40            3          0</span>`);
H.push(`<span class="dim"> credential-leak    72            51         0</span>`);
H.push(`<span class="dim"> prompt-injection   0 (static)    2          0</span>`);
H.push(``);
H.push(`Posture score: <span class="score-f">0/100</span>  <span class="score-badge">GRADE F</span>`);
H.push(`<span class="dim">SARIF written to mcpveil.sarif · upload to GitHub Code Scanning</span>`);
H.push(`<span class="crit">✖ exit 1 — findings at/above fail-on threshold</span>`);
H.push(`<span class="prompt">➜ </span><span class="dim">~/mcp-servers/registry-api</span> <span class="cursor"></span>`);

let f = 0;
window.nextFrame = () => {
  f++;
  const n = Math.min(f, H.length);
  document.getElementById("out").innerHTML = H.slice(0, n).join("\n");
  return n >= H.length;
};
window.totalFrames = H.length + 10; // hold the final screen
</script>
</body>
</html>
