<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MCPVeil logo">
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cf6"/>
      <stop offset="1" stop-color="#4b3fd4"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!-- shield -->
  <path d="M64 8 L112 26 V62 C112 90 92 108 64 120 C36 108 16 90 16 62 V26 Z"
        fill="url(#veil)" stroke="#2a2470" stroke-width="3"/>
  <!-- veil fold: the scanner passes under the surface -->
  <path d="M32 52 C44 62 52 44 64 54 C76 64 84 46 96 56"
        fill="none" stroke="#cfcbff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- active scan beam crossing the shield -->
  <rect x="26" y="70" width="76" height="7" rx="3.5" fill="url(#beam)"/>
  <!-- probe points on the beam -->
  <circle cx="40" cy="73.5" r="3.4" fill="#0e7490"/>
  <circle cx="64" cy="73.5" r="3.4" fill="#0e7490"/>
  <circle cx="88" cy="73.5" r="3.4" fill="#0e7490"/>
  <!-- confirmed-finding dot -->
  <path d="M64 88 l6.5 6.5 -6.5 6.5 -6.5 -6.5 Z" fill="#f87171" stroke="#7f1d1d" stroke-width="1.4"/>
</svg>
